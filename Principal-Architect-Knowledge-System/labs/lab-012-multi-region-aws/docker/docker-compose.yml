services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8102:8102"
    networks:
      - aws-lab-net

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,rds,ec2,elbv2,route53
      DEBUG: 0
    networks:
      - aws-lab-net
    profiles:
      - full

networks:
  aws-lab-net:
    driver: bridge
