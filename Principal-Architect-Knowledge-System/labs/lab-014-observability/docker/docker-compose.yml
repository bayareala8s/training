services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8104:8104"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - o11y-net

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - o11y-net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - o11y-net

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - o11y-net

networks:
  o11y-net:
    driver: bridge
