services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8105:8105"
    networks:
      - rag-net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5435:5432"
    networks:
      - rag-net
    profiles:
      - full

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    networks:
      - rag-net
    profiles:
      - full

networks:
  rag-net:
    driver: bridge
