services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stripe_lab
      POSTGRES_PASSWORD: stripe_lab
      POSTGRES_DB: stripe_lab
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stripe-lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stripe_lab -d stripe_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    networks:
      - stripe-lab-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://stripe_lab:stripe_lab@postgres:5432/stripe_lab
      REDIS_URL: redis://redis:6379/0
      STRIPE_MOCK_DELAY: "0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - stripe-lab-net
    command: ["python", "-m", "src.main", "--serve"]

volumes:
  pgdata:

networks:
  stripe-lab-net:
    driver: bridge
