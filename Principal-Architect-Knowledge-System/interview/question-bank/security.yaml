- id: sec-001
  domain: security
  topic: zero-trust-architecture
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['security', 'stripe', 'cloud']
  estimated_minutes: 15
  question: |
    Design zero-trust architecture for internal services replacing perimeter VPN model.
  expected_signals:
    - Identity per workload and user
    - mTLS or token-based service auth
    - Policy enforcement points explicit
    - Continuous verification not one-time
  red_flags:
    - Zero trust = no firewalls
    - VPN with flat network inside
    - Implicit trust by IP range
  follow_ups:
