- id: cloud-001
  domain: cloud-architecture
  topic: multi-region-active-active
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['aws', 'gcp', 'azure']
  estimated_minutes: 15
  question: |
    Design active-active multi-region architecture for a global SaaS API. What consistency and failover tradeoffs do you accept?
  expected_signals:
    - Data classification drives sync vs async replication
    - Conflict resolution explicit for shared writes
    - RPO/RTO per data class with stated assumptions
    - Runbooks for regional drain and traffic shift
  red_flags:
    - Linearizable writes everywhere without cost discussion
    - DNS-only failover story
    - No partition behavior
  follow_ups:
    - How do you test regional failover?
    - Data residency constraints?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Define problem → mechanism → failure/partition behavior → operational implications → explicit tradeoffs.
