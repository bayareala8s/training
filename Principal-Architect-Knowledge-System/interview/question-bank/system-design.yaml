questions:

- id: sd-001
  domain: system-design
  topic: url-shortener
  difficulty: principal
  question_type: system-design
  company_patterns: ['faang', 'snowflake', 'stripe']
  estimated_minutes: 45
  question: |
    Design a global URL shortener handling 100M new URLs/day and 10:1 read ratio.
  expected_signals:
    - Clarifies functional and non-functional requirements; states non-goals
    - High-level diagram with data flow and API sketch
    - Back-of-envelope QPS/storage with stated assumptions
    - Deep dive on bottleneck with tradeoffs
    - "Failure modes: partition, dependency, hot keys; observability and rollout"
  red_flags:
    - Jumps to technology list without requirements
    - No failure or consistency discussion where needed
    - Invented scale numbers inconsistent with math
    - Ignores cost or operational burden
  follow_ups:
    - What breaks at 10× scale?
    - How do you migrate from current architecture?
    - What consistency does the write path provide?
    - What are your SLOs and error budget policy?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Requirements → estimates → architecture → deep dive → failures → ops/evolution → summary tradeoffs.
