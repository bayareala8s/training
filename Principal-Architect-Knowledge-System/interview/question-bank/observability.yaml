- id: obs-001
  domain: observability
  topic: metrics-cardinality
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['datadog', 'grafana', 'google']
  estimated_minutes: 15
  question: |
    Prometheus cardinality explosion from high-cardinality labels. Architectural fixes?
  expected_signals:
    - Label design guidelines; avoid user_id in labels
    - Recording rules and aggregation
    - Federation or hierarchical metrics
    - Cost and retention tiering
  red_flags:
    - Unlimited label dimensions
    - Delete metrics without stakeholder notice
    - Cardinality ignored until crash
  follow_ups:
    - Exemplars for traces link?
    - Mimir/Cortex vs single Prometheus?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Define problem → mechanism → failure/partition behavior → operational implications → explicit tradeoffs.
