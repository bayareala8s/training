- id: k8s-001
  domain: kubernetes-platform
  topic: cluster-design
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['kubernetes', 'aws-eks', 'gcp-gke']
  estimated_minutes: 15
  question: |
    Design Kubernetes cluster topology for 300 microservices across prod and non-prod with strong isolation.
  expected_signals:
    - Separate clusters vs large shared with policy
    - Control plane sizing and HA
    - Node pool segmentation by workload
    - Upgrade and blast radius per cluster
  red_flags:
    - Single cluster for everything
    - No non-prod isolation
    - Ignore control plane failure
  follow_ups:
    - How many clusters per region?
    - Hosted vs self-managed control plane?
