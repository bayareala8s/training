- id: ds-001
  domain: distributed-systems
  topic: partial-failure
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: []
  estimated_minutes: 15
  question: |
    Why is partial failure the defining challenge of distributed systems, and how does it change API and timeout design?
  expected_signals:
    - Distinguishes fail-stop from slow/degraded (gray failure)
    - Timeouts create ambiguity—at-least-once retries and idempotency
    - "End-to-end argument: reliability requires application awareness"
    - Operational detection harder than crash
  red_flags:
    - Claims TCP guarantees application reliability
    - No mention of retry duplication
  follow_ups:
    - What is a gray failure?
    - How do you test partial failure in CI?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Define partial failure → async network → ambiguous outcomes → design idempotent handlers, deadlines, cancellation, and observability for in-flight work.
- id: ds-002
  domain: distributed-systems
  topic: safety-and-liveness
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: []
  estimated_minutes: 15
  question: |
    For a leader-based replication system, state one safety and one liveness property. What happens to each during a partition?
  expected_signals:
    - "Safety: at most one leader / no conflicting commits"
    - "Liveness: eventual progress with majority"
    - Minority partition sacrifices liveness to preserve safety
    - Links to FLP intuition without misquoting
  red_flags:
    - Conflates safety with availability
    - Claims both fully satisfied under partition
  follow_ups:
    - Give an example where liveness is intentionally weakened
    - How do operators detect liveness violations?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Name properties → map to leader election → partition splits majority/minority → minority stalls, majority continues → client visibility.
- id: ds-003
  domain: distributed-systems
  topic: cap-theorem
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: []
  estimated_minutes: 15
  question: |
    Explain CAP in terms of network partitions. What can a system choose, and what is often misunderstood?
  expected_signals:
    - Partition is given; tradeoff is C vs A for that partition window
    - Many systems are AP with tunable consistency
    - CAP is about one partition event, not permanent choice
    - PACELC extension for normal operation
  red_flags:
    - Claims you must pick one of three always
    - Confuses consistency with ACID only
  follow_ups:
    - How does DynamoDB tunable consistency fit?
    - What does Spanner optimize under PACELC?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Partition scenario → cannot have linearizable writes and full availability on both sides → examples → normal-case latency/consistency via PACELC.
