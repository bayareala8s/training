- id: ds-008
  domain: distributed-systems
  topic: quorum-systems
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: []
  estimated_minutes: 15
  question: |
    For N=5 replicas, what read and write quorum sizes give strong consistency? What if R+W ≤ N?
  expected_signals:
    - R+W > N prevents stale quorum overlap
    - W > N/2 for write uniqueness
    - Analyze stale read scenario when R+W ≤ N
    - Tail latency impact of larger quorums
  red_flags:
    - Says majority without math
    - Ignores concurrent writers
  follow_ups:
    - Sloppy quorum vs strict quorum?
    - Impact of async replication on quorums?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Define quorums → overlap argument → example N=5 R3 W3 → failure cases → sloppy quorums and hint handoff risks.
