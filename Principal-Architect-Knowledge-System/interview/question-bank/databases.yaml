  domain: databases
  topic: acid-vs-base
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['postgres', 'aws', 'mongo']
  estimated_minutes: 15
  question: |
    Compare ACID and BASE for a global inventory system with flash sales.
  expected_signals:
