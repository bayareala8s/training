- id: ai-001
  domain: ai-systems
  topic: llm-inference-architecture
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['openai', 'anthropic', 'google']
  estimated_minutes: 15
  question: |
    Design LLM inference platform serving 50K concurrent chat sessions globally.
  expected_signals:
    - Model routing and load balancing
    - KV cache and batching architecture
    - Regional deployment for latency
    - Fallback and degradation tiers
  red_flags:
