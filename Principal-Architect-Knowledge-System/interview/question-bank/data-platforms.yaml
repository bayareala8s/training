  domain: data-platforms
  topic: lakehouse-architecture
  difficulty: principal
  question_type: technical-deep-dive
  company_patterns: ['snowflake', 'databricks', 'aws']
  estimated_minutes: 15
  question: |
    Design lakehouse architecture unifying warehouse and data lake for 500 analysts.
  expected_signals:
    - Open table format on object storage
    - ACID on lake via Iceberg/Delta
    - Separate compute engines sharing storage
    - Governance layer unified
  red_flags:
    - Duplicate data lake and warehouse forever
    - No table format—raw files only
    - Ignore concurrent write conflicts
  follow_ups:
