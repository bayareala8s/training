- id: lead-001
  domain: architecture-leadership
  topic: technical-strategy
  difficulty: principal
  question_type: behavioral-leadership
  company_patterns: ['amazon', 'microsoft', 'google']
  estimated_minutes: 20
  question: |
    How would you draft a three-year technical strategy for a platform team supporting 30 product squads?
  expected_signals:
    - Vision pillars tied to business outcomes
    - Phased roadmap with explicit non-goals
    - Metrics for adoption and toil reduction
    - Risk register and dependencies
  red_flags:
    - Technology laundry list
    - No stakeholder alignment plan
  follow_ups:
    - How handle competing executive priorities?
    - What if strategy ignored after publish?
  scoring_rubric:
    excellent: "Principal-level depth with safety/liveness separation, operational implications, and explicit tradeoffs."
    good: "Correct mechanism and tradeoffs; minor gaps in ops or organizational scope."
    adequate: "Surface understanding; struggles under partition or consistency follow-ups."
    weak: "Hand-waving, confused guarantees, or no failure model."
  strong_answer_outline: |
    Situation → constraints → actions (I) → measurable outcome → lessons → principal scope reflection.
