# Terraform CI — BayAreaLa8s Terraform for Real Enterprises
# Works in standalone repo OR bayareala8s/training monorepo subdirectory.

name: Terraform CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "Terraform-for-Real-Enterprises/**"
      - "modules/**"
      - "labs/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "Terraform-for-Real-Enterprises/**"
      - "modules/**"
      - "labs/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: us-west-2

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  detect-root:
    runs-on: ubuntu-latest
    outputs:
      course_root: ${{ steps.root.outputs.course_root }}
    steps:
      - uses: actions/checkout@v4
      - id: root
        name: Detect course root path
        run: |
          if [ -d "Terraform-for-Real-Enterprises/labs" ]; then
            echo "course_root=Terraform-for-Real-Enterprises/" >> "$GITHUB_OUTPUT"
          else
            echo "course_root=" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: detect-root
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, test, prod]
    defaults:
      run:
        working-directory: ${{ needs.detect-root.outputs.course_root }}labs/shared/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: |
          ROOT="${{ needs.detect-root.outputs.course_root }}"
          terraform fmt -check -recursive "${ROOT}modules" "${ROOT}labs"
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  validate-bootstrap:
    needs: detect-root
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.detect-root.outputs.course_root }}labs/week-01/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false
      - run: terraform validate

  security:
    needs: detect-root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ needs.detect-root.outputs.course_root }}modules/,${{ needs.detect-root.outputs.course_root }}labs/shared/
          framework: terraform
          soft_fail: true

  plan-dev:
    needs: [detect-root, validate]
    if: ${{ secrets.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.detect-root.outputs.course_root }}labs/shared/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init (remote state)
        run: terraform init -backend-config=backend.hcl.example -input=false
      - name: Terraform Plan (live dev state)
        run: terraform plan -var-file=terraform.tfvars.example -input=false -no-color
