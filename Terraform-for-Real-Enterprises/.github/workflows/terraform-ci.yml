name: Terraform CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  TF_VERSION: "1.7.5"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, test, prod]
    defaults:
      run:
        working-directory: labs/shared/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive ../../../..
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: modules/
          framework: terraform
          soft_fail: true
