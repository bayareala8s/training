# Terraform CI — BayAreaLa8s Terraform for Real Enterprises
#
# Monorepo: lives at training/Terraform-for-Real-Enterprises/.github/workflows/
# Set TF_COURSE_ROOT to "" if this course is the repository root.

name: Terraform CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - "Terraform-for-Real-Enterprises/modules/**"
      - "Terraform-for-Real-Enterprises/labs/**"
      - "Terraform-for-Real-Enterprises/.github/workflows/**"
      - "modules/**"
      - "labs/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "Terraform-for-Real-Enterprises/modules/**"
      - "Terraform-for-Real-Enterprises/labs/**"
      - "modules/**"
      - "labs/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: us-west-2
  # Monorepo path prefix (empty string if course is repo root)
  TF_COURSE_ROOT: Terraform-for-Real-Enterprises

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, test, prod]
    defaults:
      run:
        working-directory: ${{ env.TF_COURSE_ROOT }}/labs/shared/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive ${{ env.TF_COURSE_ROOT }}
      - name: Init
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_COURSE_ROOT }}/modules/
          framework: terraform
          soft_fail: true

  plan-dev:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_COURSE_ROOT }}/labs/shared/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init (remote state)
        run: terraform init -backend-config=backend.hcl.example -input=false
      - name: Terraform Plan (live dev state)
        run: terraform plan -var-file=terraform.tfvars.example -input=false -no-color

