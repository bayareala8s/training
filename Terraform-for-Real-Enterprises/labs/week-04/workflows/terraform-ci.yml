name: Terraform CI (Course Lab)

on:
  pull_request:
    branches: [main, master]
    paths:
      - "modules/**"
      - "labs/shared/**"
      - ".github/workflows/**"
      - "labs/week-04/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "modules/**"
      - "labs/shared/**"

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: us-west-2
  WORKING_DIRECTORY: labs/shared/environments/dev

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../../..
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: modules/
          framework: terraform
          soft_fail: true

  plan:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # Configure OIDC for real AWS plan:
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Plan (local backend mock)
        run: terraform plan -input=false
        env:
          TF_VAR_environment: dev
          TF_VAR_owner: ci
          TF_VAR_project_name: bal8s-tf
          TF_VAR_aws_region: us-west-2
          TF_VAR_vpc_cidr: "10.10.0.0/16"
          TF_VAR_availability_zones: '["us-west-2a","us-west-2b"]'
          TF_VAR_public_subnet_cidrs: '["10.10.1.0/24","10.10.2.0/24"]'
          TF_VAR_private_subnet_cidrs: '["10.10.11.0/24","10.10.12.0/24"]'
          TF_VAR_enable_nat_gateway: false
          TF_VAR_use_nat_instance: true
          TF_VAR_enable_lab_compute: false
          TF_VAR_instance_type: t3.micro
