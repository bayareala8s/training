name: Capstone Option 2 — Shared Services CI

on:
  pull_request:
    paths:
      - "capstone/option-02-shared-services/**"
      - "modules/**"
  push:
    branches: [main, master]
    paths:
      - "capstone/option-02-shared-services/**"

env:
  TF_VERSION: "1.7.5"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [hub, spoke-dev]
    defaults:
      run:
        working-directory: capstone/option-02-shared-services/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false
      - run: terraform validate
