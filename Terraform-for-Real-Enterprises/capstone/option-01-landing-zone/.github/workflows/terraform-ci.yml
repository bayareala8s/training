name: Capstone Option 1 — Landing Zone CI

on:
  pull_request:
    paths:
      - "capstone/option-01-landing-zone/**"
      - "modules/**"
  push:
    branches: [main, master]
    paths:
      - "capstone/option-01-landing-zone/**"
      - "modules/**"

env:
  TF_VERSION: "1.7.5"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [shared, workload-dev]
    defaults:
      run:
        working-directory: capstone/option-01-landing-zone/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive ../../../../..
      - run: terraform init -backend=false
      - run: terraform validate
