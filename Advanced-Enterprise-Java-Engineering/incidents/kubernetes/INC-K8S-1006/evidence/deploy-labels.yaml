# Deployment labels excerpt — payment-service / baypay-prod
# Gate: 2
# Teaching equivalent: kubectl get deploy payment-service -n baypay-prod -o yaml
# Synthetic BayPay. Captured 2026-11-19T19:38:10Z after ticket BAYPAY-10066

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: baypay-prod
  labels:
    app: payment-service
  annotations:
    baypay.example/ticket: BAYPAY-10066
    baypay.example/last-applied-by: sam.okada
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment
          image: registry.baypay.example/baypay/payment-service:3.9.1
          ports:
            - name: http
              containerPort: 8080

