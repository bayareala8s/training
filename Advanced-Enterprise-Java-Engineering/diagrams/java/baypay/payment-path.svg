<text id="t" x="36" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0a1f33">3. Create-payment path — one transaction, then 201 COMPLETED.</text>
<text x="36" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0d8fad">Same key + same body replays. Frozen account declines (422). Email is not on Payment (SOLID S).</text>
<desc id="d">POST with Idempotency-Key hits replay check, Money and Authorizer, state machine, ledger post, in-process notify, then 201 COMPLETED.</desc>
