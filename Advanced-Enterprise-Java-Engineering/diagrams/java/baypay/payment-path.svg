ext-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0a1f33">Post</text><text x="694" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">ledger</text><line x1="760" y1="215" x2="772" y2="215" stroke="#0a1f33" stroke-width="2" marker-end="url(#arrow)"/><rect x="776" y="160" width="132" height="110" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="842" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0a1f33">Notify</text><text x="842" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">in-process</text><line x1="908" y1="215" x2="920" y2="215" stroke="#0a1f33" stroke-width="2" marker-end="url(#arrow)"/><rect x="924" y="160" width="132" height="110" rx="8" fill="#e8f4f8" stroke="#0d7a4f" stroke-width="2"/><text x="990" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0a1f33">201</text><text x="990" y="234" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">COMPLETED</text><rect x="36" y="300" width="1028" height="170" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="550" y="336" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0a1f33">What this path refuses</text><text x="550" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c6b7a">No setStatus on Payment  ·  transitions go through PaymentStateMachine</text><text x="550" y="394" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c6b7a">No email inside PaymentApplicationService  ·  NotificationListener observes completion</text><text x="550" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c6b7a">No card SDK constructed in the service  ·  PaymentAuthorizer is the SOLID D seam</text><text x="550" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c6b7a">Same Idempotency-Key + different body → 409  ·  missing key → 400</text><text x="36" y="506" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c6b7a">BayPay Financial Services is fictional. BayLearn AEJE. One process today; extract a module only when scale, store, or team forces it.</text>
