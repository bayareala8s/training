<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img">
  <title>BayPay on AWS - EKS + shared RDS network topology</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C45500"/>
    </marker>
  </defs>
  <rect width="1600" height="1180" fill="#F4F6F8"/>
  <text x="56" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#16191F">BayPay on AWS - EKS + shared RDS PostgreSQL</text>
  <text x="56" y="82" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#545B64">us-west-2 - same VPC and database as the ECS lab - same OCI image - fictional Harbor Market / Avery Chen</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="56" y="104" width="210" height="28" rx="14" fill="#232F3E"/>
    <text x="161" y="123" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Region us-west-2</text>
    <rect x="276" y="104" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#D5DBDB"/>
    <text x="351" y="123" text-anchor="middle" font-size="12" fill="#16191F">Reuses RDS</text>
    <rect x="436" y="104" width="168" height="28" rx="14" fill="#FFFFFF" stroke="#D5DBDB"/>
    <text x="520" y="123" text-anchor="middle" font-size="12" fill="#16191F">No NAT Gateway</text>
    <rect x="614" y="104" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#D5DBDB"/>
    <text x="689" y="123" text-anchor="middle" font-size="12" fill="#16191F">No Multi-AZ</text>
    <rect x="774" y="104" width="200" height="28" rx="14" fill="#FFFFFF" stroke="#D5DBDB"/>
    <text x="874" y="123" text-anchor="middle" font-size="12" fill="#16191F">One t3.small node</text>
  </g>

  <rect x="200" y="154" width="260" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
  <text x="330" y="180" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Harbor Market (client)</text>
  <text x="330" y="200" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">Swagger / curl HTTP :80</text>

  <rect x="560" y="154" width="280" height="64" rx="6" fill="#232F3E"/>
  <text x="700" y="180" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Internet Gateway</text>
  <text x="700" y="200" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D5DBDB">0.0.0.0/0 from public subnets</text>

  <rect x="940" y="154" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="1090" y="180" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">ECS ALB (already running)</text>
  <text x="1090" y="200" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">Same Avery rows on the same RDS</text>

  <line x1="460" y1="186" x2="560" y2="186" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#545B64">TCP 80</text>

  <rect x="40" y="250" width="1520" height="780" rx="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="60" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16191F">Shared VPC  10.20.0.0/16  (created by the ECS lab)</text>
  <text x="60" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">EKS does not create a second database. Destroy EKS first, then the ECS stack.</text>

  <text x="280" y="336" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">us-west-2a</text>
  <text x="780" y="336" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">us-west-2b</text>

  <rect x="60" y="352" width="440" height="300" rx="6" fill="#E9F7EF" stroke="#1D8102"/>
  <rect x="560" y="352" width="440" height="300" rx="6" fill="#E9F7EF" stroke="#1D8102"/>
  <text x="80" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1D8102">PUBLIC  10.20.1.0/24</text>
  <text x="580" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1D8102">PUBLIC  10.20.2.0/24</text>

  <rect x="88" y="396" width="384" height="72" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="280" y="426" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Network Load Balancer</text>
  <text x="280" y="448" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">Service type LoadBalancer :80</text>

  <rect x="588" y="396" width="384" height="72" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="780" y="426" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Network Load Balancer</text>
  <text x="780" y="448" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">Same NLB - second AZ</text>

  <rect x="588" y="484" width="384" height="148" rx="5" fill="#232F3E"/>
  <text x="780" y="516" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">EKS managed node (t3.small)</text>
  <text x="780" y="538" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D5DBDB">ip-10-20-2-204  public IP  no NAT</text>
  <text x="780" y="558" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D5DBDB">Pod payment-service  profile eks</text>
  <text x="780" y="578" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D5DBDB">256m / 512Mi  same image as ECS</text>
  <text x="780" y="598" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#D5DBDB">Cluster baypay-eksrd-cluster</text>

  <line x1="472" y1="432" x2="588" y2="432" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="780" y1="468" x2="780" y2="484" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="794" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#C45500">TCP 8080 NodePort</text>

  <rect x="60" y="672" width="440" height="210" rx="6" fill="#E8F0FE" stroke="#0073BB"/>
  <rect x="560" y="672" width="440" height="210" rx="6" fill="#E8F0FE" stroke="#0073BB"/>
  <text x="80" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0073BB">PRIVATE  10.20.11.0/24</text>
  <text x="580" y="696" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0073BB">PRIVATE  10.20.12.0/24</text>

  <rect x="88" y="716" width="384" height="140" rx="5" fill="#FFFFFF" stroke="#0073BB" stroke-width="2"/>
  <text x="280" y="748" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16191F">Amazon RDS PostgreSQL 16</text>
  <text x="280" y="772" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">SHARED with ECS - not a second DB</text>
  <text x="280" y="792" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">baypay-ecsrd-pg  single-AZ  private</text>
  <text x="280" y="812" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">SG allows ECS tasks AND EKS cluster SG</text>
  <text x="280" y="832" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">JDBC TCP 5432</text>

  <rect x="588" y="716" width="384" height="140" rx="5" fill="#FFFFFF" stroke="#0073BB" stroke-dasharray="6 4"/>
  <text x="780" y="776" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">DB subnet group member</text>
  <text x="780" y="800" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">No instance (not Multi-AZ)</text>

  <path d="M 588 558 C 480 558, 360 620, 280 716" fill="none" stroke="#C45500" stroke-width="2.25" marker-end="url(#arrowAccent)"/>
  <text x="340" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#C45500">JDBC 5432  VPC local</text>

  <rect x="1040" y="352" width="492" height="530" rx="6" fill="#F2F3F3" stroke="#879596"/>
  <text x="1286" y="384" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Control plane (reused + EKS)</text>

  <rect x="1064" y="404" width="444" height="80" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="1286" y="436" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Amazon EKS API</text>
  <text x="1286" y="458" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">baypay-eksrd-cluster  ~$0.10/hour</text>

  <rect x="1064" y="500" width="444" height="80" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="1286" y="532" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Amazon ECR (same repo as ECS)</text>
  <text x="1286" y="554" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">baypay/payment-service-ecs-demo:tag</text>

  <rect x="1064" y="596" width="444" height="80" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="1286" y="628" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Secrets Manager (same secret)</text>
  <text x="1286" y="650" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">kubectl secret baypay-db from baypay-ecsrd/db</text>

  <rect x="1064" y="692" width="444" height="80" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="1286" y="724" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">IAM node role</text>
  <text x="1286" y="746" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">EKS worker + CNI + ECR read</text>

  <rect x="1064" y="788" width="444" height="72" rx="5" fill="#FFFFFF" stroke="#232F3E"/>
  <text x="1286" y="816" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#16191F">Kubernetes Secret envFrom</text>
  <text x="1286" y="838" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">BAYPAY_DB_URL / USER / PASSWORD</text>

  <text x="60" y="1070" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16191F">Teach this in order</text>
  <text x="60" y="1092" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#16191F">1. Client to IGW to NLB :80     2. NLB to Pod :8080     3. Pod to SHARED RDS :5432     4. Node to ECR / EKS API :443 via IGW</text>
  <text x="60" y="1116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">Same image as ECS. Profile eks (not prod). Heap MaxRAMPercentage=75. Stop EKS first (student/work/eks-rds-lab/stop.sh), then ECS/RDS.</text>
  <text x="60" y="1138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#545B64">Optional demo only. Required AEJE student apply does not create EKS, NAT, or RDS.</text>
</svg>
