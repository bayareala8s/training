<text id="t" x="36" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0a1f33">2. Same app, two runtimes — laptop H2, or student Fargate.</text>
<text x="36" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0d8fad">Student AWS apply: public subnets + IGW + ALB. No NAT, no EKS, no RDS. Profile stays local (H2 in the task).</text>
<desc id="d">Left: curl to localhost 8080 on Java 21 Spring Boot with H2. Right: merchants to ALB to Fargate 256/512 running the same image. Both use the modular monolith.</desc>
<rect x="36" y="80" width="500" height="390" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="286" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0a1f33">Local (default)</text><text x="286" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">reference-apps/baypay  ·  ./mvnw spring-boot:run</text><rect x="64" y="154" width="444" height="42" rx="8" fill="#e8f4f8" stroke="#0d8fad" stroke-width="2"/><text x="286" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">curl / Swagger  →  localhost:8080</text><rect x="64" y="210" width="444" height="42" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="286" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">Spring Boot 3.5.5  ·  Java 21  ·  actuator</text><rect x="64" y="266" width="444" height="42" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="286" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">Five Maven modules in one process</text><rect x="64" y="322" width="444" height="42" rx="8" fill="#fff8e8" stroke="#c47b00" stroke-width="2"/><text x="286" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">JPA  →  H2 mem  (MODE=PostgreSQL)</text><text x="286" y="390" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Health: /actuator/health/liveness</text><text x="286" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Heap teaching: -Xmx must stay below the container limit</text><text x="286" y="444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">Never set -Xmx equal to 512 MiB on the Fargate task</text><rect x="564" y="80" width="500" height="390" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="814" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0a1f33">Student AWS (us-west-2)</text><text x="814" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">BUILD-1101 extra credit  ·  destroy the same day</text><rect x="592" y="154" width="444" height="42" rx="8" fill="#e8f4f8" stroke="#0d8fad" stroke-width="2"/><text x="814" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">Merchants  →  ALB :80</text><rect x="592" y="210" width="444" height="42" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="814" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">ECS Fargate  0.25 vCPU / 512 MiB</text><rect x="592" y="266" width="444" height="42" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="814" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">Same image  ·  SPRING_PROFILES_ACTIVE=local</text><rect x="592" y="322" width="444" height="42" rx="8" fill="#fff8e8" stroke="#c47b00" stroke-width="2"/><text x="814" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">H2 inside the task  ·  no RDS apply</text><text x="814" y="390" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Public subnets + Internet Gateway</text><text x="814" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">ECR baypay/payment-service:&lt;tag&gt;  (never :latest)</text><text x="814" y="444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b42318">Do not add NAT, EKS, or Multi-AZ RDS</text><text x="36" y="506" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c6b7a">BayPay Financial Services is fictional. BayLearn AEJE. One process today; extract a module only when scale, store, or team forces it.</text>
</svg>
