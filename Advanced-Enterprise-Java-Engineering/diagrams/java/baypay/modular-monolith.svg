<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0a1f33"/></marker>
  <marker id="arrowTeal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0d8fad"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f4f7fa"/>
<text id="t" x="36" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0a1f33">1. BayPay is a modular monolith — five Maven modules, one JVM.</text>
<text x="36" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0d8fad">payment-service is the composition root. Posting and notify are in-process events, not extra HTTP hops.</text>
<desc id="d">Merchants call payment-service. Inside one JVM: API, payment and refund use cases, posting worker, notification listener, and shared domain plus JPA. One database.</desc>
<rect x="36" y="90" width="160" height="150" rx="8" fill="#e8f4f8" stroke="#0d8fad" stroke-width="2"/><text x="116" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">Merchants</text><text x="116" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Harbor Market</text><text x="116" y="176" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Avery Chen</text><text x="116" y="206" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d8fad">HTTP :8080</text><line x1="196" y1="165" x2="248" y2="165" stroke="#0a1f33" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="78" width="560" height="360" rx="8" fill="#ffffff" stroke="#0a1f33" stroke-width="2"/><text x="530" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0a1f33">payment-service  ·  one Spring Boot process</text><text x="530" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Java 21  ·  Spring Boot 3.5.5  ·  composition root</text><rect x="270" y="144" width="250" height="70" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="395" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">API  /api/v1/payments</text><text x="395" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">/api/v1/refunds  ·  OpenAPI</text><rect x="540" y="144" width="250" height="70" rx="8" fill="#ffffff" stroke="#0d8fad" stroke-width="2"/><text x="665" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">PaymentApplicationService</text><text x="665" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">RefundApplicationService</text><rect x="270" y="230" width="250" height="70" rx="8" fill="#e8f4f8" stroke="#0d8fad" stroke-width="2"/><text x="395" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">transaction-worker</text><text x="395" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">in-process  ·  ledger post</text><rect x="540" y="230" width="250" height="70" rx="8" fill="#e8f4f8" stroke="#0d8fad" stroke-width="2"/><text x="665" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">notification-service</text><text x="665" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">in-process  ·  email record</text><rect x="270" y="316" width="520" height="100" rx="8" fill="#fff8e8" stroke="#c47b00" stroke-width="2"/><text x="530" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0a1f33">shared</text><text x="530" y="372" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Money  ·  Payment  ·  state machine  ·  idempotency</text><text x="530" y="394" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Customer  ·  Account  ·  JPA repositories</text><line x1="810" y1="255" x2="868" y2="255" stroke="#0a1f33" stroke-width="2" marker-end="url(#arrow)"/><rect x="870" y="180" width="194" height="160" rx="8" fill="#e8f4f8" stroke="#0d8fad" stroke-width="2"/><text x="967" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0a1f33">One database</text><text x="967" y="256" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">H2 local</text><text x="967" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b7a">Postgres prod profile</text><text x="967" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0d8fad">not five DBs</text><text x="36" y="506" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5c6b7a">BayPay Financial Services is fictional. BayLearn AEJE. One process today; extract a module only when scale, store, or team forces it.</text>
</svg>
