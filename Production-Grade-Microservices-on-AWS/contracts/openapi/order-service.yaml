openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /orders:
    post:
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created
        "400":
          description: Invalid request
        "404":
          description: Product not found
  /orders/{order_id}:
    get:
      summary: Get order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not found
components:
  schemas:
    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
    OrderCreate:
      type: object
      required: [user_id, items]
      properties:
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    Order:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        status:
          type: string
        total:
          type: number
        items:
          type: array
          items:
            type: object
