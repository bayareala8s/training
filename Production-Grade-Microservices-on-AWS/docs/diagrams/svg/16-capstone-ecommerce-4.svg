<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 651.875 450" style="max-width: 651.875px; background-color: transparent;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:Helvetica,Arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:Helvetica,Arial,sans-serif;}#my-svg .slice{font-family:Helvetica,Arial,sans-serif;fill:#000000;font-size:17px;}#my-svg .legend text{fill:#333;font-family:Helvetica,Arial,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#999;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,175.945,-57.168L0,0Z" fill="#F4F4F4" class="pieCircle"/><path d="M175.945,-57.168A185,185,0,0,1,57.168,175.945L0,0Z" fill="#555" class="pieCircle"/><path d="M57.168,175.945A185,185,0,0,1,-108.74,149.668L0,0Z" fill="#BBB" class="pieCircle"/><path d="M-108.74,149.668A185,185,0,0,1,-185,0L0,0Z" fill="#777" class="pieCircle"/><path d="M-185,0A185,185,0,0,1,-108.74,-149.668L0,0Z" fill="#999" class="pieCircle"/><path d="M-108.74,-149.668A185,185,0,0,1,0,-185L0,0Z" fill="#DDD" class="pieCircle"/><text transform="translate(81.55520375558065,-112.25110796952396)" class="slice" style="text-anchor: middle;">20%</text><text transform="translate(123.62715523113604,62.99118183886211)" class="slice" style="text-anchor: middle;">25%</text><text transform="translate(-21.705282024332025,137.04175725757537)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-123.62715523113603,62.991181838862126)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-123.62715523113604,-62.991181838862104)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-42.87610796952397,-131.95909163595255)" class="slice" style=