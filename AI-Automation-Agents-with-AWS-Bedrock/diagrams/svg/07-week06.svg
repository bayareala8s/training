<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Week 6 — Observability, Governance &amp; AI Safety</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">Audit trails, dashboards, alerts, redaction policy, human-in-the-loop</text>
<rect x="40.0" y="78.0" width="1520.0" height="70.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEARNING FOCUS</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">Implement metadata-only audit logging, CloudWatch dashboards, cost alarms, and human approval branches for high-risk decisions.</text>
<rect x="360.0" y="520.0" width="420.0" height="110.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="370.0" y="542.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">AUDIT RECORD (metadata only)</text>
<text x="370.0" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">correlation_id | timestamp | model_id</text>
<text x="370.0" y="570.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">input_size | output_size | validation_status</text>
<text x="370.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">route_or_action | latency_ms</text>
<rect x="860.0" y="480.0" width="380.0" height="110.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="870.0" y="502.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">DASHBOARD WIDGETS</text>
<text x="870.0" y="516.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• Request count</text>
<text x="870.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• Error rate</text>
<text x="870.0" y="544.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• p95 latency</text>
<text x="870.0" y="558.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• Validation failures</text>
<text x="870.0" y="572.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• Retry count</text>
<rect x="80.0" y="720.0" width="400.0" height="130.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="90.0" y="742.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">GOVERNANCE CHECKLIST</text>
<text x="90.0" y="756.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">☐ Prompt version controlled</text>
<text x="90.0" y="770.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">☐ Model access reviewed</text>
<text x="90.0" y="784.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">☐ Log redaction policy</text>
<text x="90.0" y="798.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">☐ Budget alert configured</text>
<text x="90.0" y="812.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">☐ HITL for risky actions</text>
<rect x="520.0" y="720.0" width="400.0" height="80.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="530.0" y="742.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">NEVER STORE IN LOGS</text>
<text x="530.0" y="756.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Raw customer PII, passwords, full card numbers, unredacted prompts in regulated industries</text>
<rect x="960.0" y="720.0" width="400.0" height="100.0" rx="6" fill="#FFF8E6" stroke="#FFB800" />
<text x="970.0" y="742.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">INSTRUCTOR TALKING POINT</text>
<text x="970.0" y="756.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Query audit by correlation_id live. Trigger alarm with bad requests. Connect governance to real incident response.</text>
