<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Week 7 — Enterprise AI Agent System</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">Router, tool policy, memory with TTL, event-driven chaining</text>
<rect x="40.0" y="78.0" width="1520.0" height="70.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEARNING FOCUS</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">Build an agent-like router that outputs a structured plan, enforces tool allow-lists, stores session memory safely, and chains workflows via events.</text>
<rect x="60.0" y="520.0" width="360.0" height="110.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="70.0" y="542.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">PLAN JSON (example)</text>
<text x="70.0" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">{</text>
<text x="70.0" y="570.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;tool&amp;quot;: &amp;quot;classify_route&amp;quot;,</text>
<text x="70.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;requires_approval&amp;quot;: false,</text>
<text x="70.0" y="598.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;reason&amp;quot;: &amp;quot;billing keywords&amp;quot;</text>
<text x="70.0" y="612.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">}</text>
<rect x="440.0" y="520.0" width="400.0" height="110.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="450.0" y="542.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">TOOL POLICY</text>
<text x="450.0" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">ALLOWED: summarize, classify_route, action_stub</text>
<text x="450.0" y="570.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">DENY: delete_prod, exfiltrate_data</text>
<text x="450.0" y="584.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">APPROVAL: action_stub, security keywords</text>
<rect x="900.0" y="600.0" width="380.0" height="100.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="910.0" y="622.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">MEMORY RULES</text>
<text x="910.0" y="636.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">STORE: short context summary, last route</text>
<text x="910.0" y="650.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">NEVER: secrets, full ticket bodies, PCI data</text>
<text x="910.0" y="664.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">TTL: 7 days (DynamoDB)</text>
<rect x="60.0" y="680.0" width="550.0" height="100.0" rx="6" fill="#FFF8E6" stroke="#FFB800" />
<text x="70.0" y="702.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">INSTRUCTOR TALKING POINT</text>
<text x="70.0" y="716.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Contrast 'autonomous agent' hype vs enterprise agent = router + policy + audit. Demo risky prompt requiring approval.</text>
