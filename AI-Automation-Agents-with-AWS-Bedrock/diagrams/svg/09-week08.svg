<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1250" viewBox="0 0 1700 1250">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#232F3E"/></marker></defs>
<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Week 8 — Capstone Architecture Options</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">Four portfolio-ready systems — all must meet the production minimum bar</text>
<rect x="40.0" y="186.0" width="380.0" height="320.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="50.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">OPTION 1 — AI Operations Assistant</text>
<rect x="440.0" y="186.0" width="380.0" height="320.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="450.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">OPTION 2 — File Automation Platform</text>
<rect x="840.0" y="186.0" width="380.0" height="320.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="850.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">OPTION 3 — Workflow Engine</text>
<rect x="1240.0" y="186.0" width="400.0" height="320.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="1250.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">OPTION 4 — Internal AI API Platform</text>
<rect x="40.0" y="536.0" width="1600.0" height="120.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="50.0" y="558.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">MINIMUM BAR (all options)</text>
<rect x="40.0" y="78.0" width="1520.0" height="70.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEARNING FOCUS</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">Deliver one capstone with orchestration, Bedrock, validation, audit, dashboard, and cost analysis. Choose the option closest to your target role.</text>
<rect x="60.0" y="220.0" width="340.0" height="120.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="70.0" y="242.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Flow:</text>
<text x="70.0" y="256.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Incident → classify severity</text>
<text x="70.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ route to team → ticket stub</text>
<text x="70.0" y="284.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ human approval if critical</text>
<rect x="460.0" y="220.0" width="340.0" height="120.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="470.0" y="242.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Flow:</text>
<text x="470.0" y="256.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">S3 upload → extract metadata</text>
<text x="470.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ classify doc → route queue</text>
<text x="470.0" y="284.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ needs-review if low confidence</text>
<rect x="860.0" y="220.0" width="340.0" height="120.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="870.0" y="242.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Flow:</text>
<text x="870.0" y="256.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">API defines workflow type</text>
<text x="870.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ Step Functions template</text>
<text x="870.0" y="284.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ validate + branch + persist</text>
<rect x="1260.0" y="220.0" width="360.0" height="120.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="1270.0" y="242.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Flow:</text>
<text x="1270.0" y="256.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">/classify /summarize /route</text>
<text x="1270.0" y="270.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ shared governance layer</text>
<text x="1270.0" y="284.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">→ per-team usage limits</text>
<rect x="60.0" y="560.0" width="1560.0" height="60.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="70.0" y="582.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">REQUIRED: Step Functions or equivalent | Bedrock | JSON validation | DynamoDB/S3 audit | CloudWatch dashboard + alarm | Cost/risk write-up | 12-min demo</text>
<rect x="40.0" y="680.0" width="500.0" height="100.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="50.0" y="702.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">DEMO SCRIPT (12 min)</text>
<text x="50.0" y="716.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">① Problem + metrics (3m) ② Happy path (5m) ③ Failure + recovery (2m) ④ Cost/governance (2m)</text>
<rect x="580.0" y="680.0" width="500.0" height="100.0" rx="6" fill="#FFF8E6" stroke="#FFB800" />
<text x="590.0" y="702.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">INSTRUCTOR TALKING POINT</text>
<text x="590.0" y="716.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Use capstone reviews to test architecture thinking — not just 'does it run'. Ask about failure modes and cost drivers.</text>
<rect x="720.0" y="860.0" width="72.0" height="72.0" rx="4" fill="#232F3E" stroke="#ffffff" stroke-width="2"/>
<text x="756.0" y="946.0" text-anchor="middle" font-size="9" fill="#232F3E">Bedrock</text>
<rect x="1000.0" y="860.0" width="72.0" height="72.0" rx="4" fill="#E7157B" stroke="#ffffff" stroke-width="2"/>
<text x="1036.0" y="946.0" text-anchor="middle" font-size="9" fill="#232F3E">Governance</text>
<rect x="480.0" y="860.0" width="72.0" height="72.0" rx="4" fill="#E7157B" stroke="#ffffff" stroke-width="2"/>
<text x="516.0" y="946.0" text-anchor="middle" font-size="9" fill="#232F3E">Orchestration</text>
<line x1="516.0" y1="896.0" x2="756.0" y2="896.0" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)" />
<line x1="756.0" y1="896.0" x2="1036.0" y2="896.0" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
<text x="40" y="1234" font-size="9" fill="#879196">BayAreaLa8s — AI Automation &amp; Agents with AWS Bedrock | AWS Architecture Icons (aws4)</text>
