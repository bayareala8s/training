<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Course Reference Architecture</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">End-to-end production AI automation on AWS — every week builds toward this pattern</text>
<rect x="40.0" y="186.0" width="380.0" height="520.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="50.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">① INGRESS — How work enters the platform</text>
<rect x="440.0" y="186.0" width="420.0" height="520.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="450.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">② ORCHESTRATION — Reliable multi-step AI workflows</text>
<rect x="880.0" y="186.0" width="380.0" height="520.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="890.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">③ AI + GUARDRAILS — Model + deterministic validation</text>
<rect x="1280.0" y="186.0" width="380.0" height="520.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="1290.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">④ DATA + OPS — Persist, audit, alert, govern</text>
<rect x="40.0" y="78.0" width="1520.0" height="70.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEARNING FOCUS</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">Understand how events and APIs enter the system, how Bedrock is invoked inside orchestrated workflows, and where validation, persistence, audit, and human oversight fit.</text>
<rect x="60.0" y="620.0" width="300.0" height="90.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="70.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Example input:</text>
<text x="70.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">{ &amp;quot;text&amp;quot;: &amp;quot;invoice charged twice&amp;quot;,</text>
<text x="70.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;correlation_id&amp;quot;: &amp;quot;abc-123&amp;quot; }</text>
<rect x="900.0" y="620.0" width="320.0" height="90.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="910.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Validated output:</text>
<text x="910.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">{ &amp;quot;label&amp;quot;: &amp;quot;billing&amp;quot;, &amp;quot;confidence&amp;quot;: 0.91,</text>
<text x="910.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;route&amp;quot;: &amp;quot;team_billing&amp;quot; }</text>
<rect x="40.0" y="720.0" width="280.0" height="94.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="50.0" y="742.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEGEND</text>
<text x="50.0" y="756.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">• Solid arrow = happy path</text>
<text x="50.0" y="770.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">• Dashed red = fallback / human</text>
<text x="50.0" y="784.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">• correlation_id in every log + audit row</text>
<rect x="1280.0" y="720.0" width="380.0" height="100.0" rx="6" fill="#FFF8E6" stroke="#FFB800" />
<text x="1290.0" y="742.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">INSTRUCTOR TALKING POINT</text>
<text x="1290.0" y="756.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Stress: Bedrock is probabilistic — orchestration + validation make automation safe. Never let the model call external systems without policy checks.</text>
<rect x="1280.0" y="840.0" width="380.0" height="80.0" rx="6" fill="#F3E8FF" stroke="#8C4FFF" />
<text x="1290.0" y="862.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">STUDENT TAKEAWAY</text>
<text x="1290.0" y="876.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Every production path needs: structured output, validator, fallback, audit trail.</text>
<rect x="92.0" y="204.0" width="200.0" height="24.0" rx="6" fill="#F2F3F3" stroke="#879196" />
