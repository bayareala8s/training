<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1150" viewBox="0 0 1700 1150">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#232F3E"/></marker></defs>
<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Week 2 — Secure Bedrock Integration</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">IAM least privilege, model access, prompt versioning, and safe logging</text>
<rect x="40.0" y="186.0" width="520.0" height="400.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="50.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">IDENTITY &amp; ACCESS</text>
<rect x="580.0" y="186.0" width="520.0" height="400.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="590.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">RUNTIME (Lambda)</text>
<rect x="1120.0" y="186.0" width="540.0" height="400.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="1130.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">BEDROCK</text>
<rect x="580.0" y="616.0" width="1080.0" height="200.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="590.0" y="638.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">OBSERVABILITY (safe)</text>
<rect x="40.0" y="78.0" width="1520.0" height="70.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEARNING FOCUS</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">Design IAM so only the runtime role can invoke specific foundation models. Enable model access, version prompts, and log metadata — not secrets.</text>
<rect x="1120.0" y="480.0" width="500.0" height="100.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="1130.0" y="502.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">IAM POLICY (example)</text>
<text x="1130.0" y="516.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Allow: bedrock:Converse</text>
<text x="1130.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Resource: arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0</text>
<text x="1130.0" y="544.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Deny: * on all other models</text>
<rect x="40.0" y="620.0" width="480.0" height="80.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="50.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">NEVER LOG</text>
<text x="50.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• Full prompts with PII</text>
<text x="50.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• API keys / tokens</text>
<text x="50.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• Credit card numbers</text>
<rect x="580.0" y="820.0" width="500.0" height="90.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="590.0" y="842.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">SAFE TO LOG</text>
<text x="590.0" y="856.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• correlation_id</text>
<text x="590.0" y="870.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• model_id</text>
<text x="590.0" y="884.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• input/output SIZE</text>
<text x="590.0" y="898.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• latency_ms</text>
<text x="590.0" y="912.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">• validation_status</text>
<rect x="40.0" y="820.0" width="480.0" height="100.0" rx="6" fill="#FFF8E6" stroke="#FFB800" />
<text x="50.0" y="842.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">INSTRUCTOR TALKING POINT</text>
<text x="50.0" y="856.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Walk through Bedrock model access in console. Show one denied call when model not enabled — students remember IAM + access gate.</text>
<rect x="92.0" y="184.0" width="200.0" height="24.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="102.0" y="206.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Who deploys?</text>
<rect x="632.0" y="184.0" width="200.0" height="24.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="642.0" y="206.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Who invokes AI?</text>
<rect x="1152.0" y="184.0" width="200.0" height="24.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="1162.0" y="206.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Model gate</text>
<rect x="632.0" y="584.0" width="200.0" height="24.0" rx="6" fill="#F2F3F3" stroke="#879196" />
<text x="642.0" y="606.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">What we log</text>
