<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Week 4 — Step Functions Orchestration</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">Classify → validate → act with retries, catch, idempotency, and failure simulation</text>
<rect x="40.0" y="186.0" width="1200.0" height="380.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="50.0" y="208.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">STATE MACHINE (Week 4 Lab)</text>
<rect x="40.0" y="596.0" width="700.0" height="280.0" rx="6" fill="#F7F8F8" stroke="#879196" stroke-dasharray="6,4"/>
<text x="50.0" y="618.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">RELIABILITY PATTERNS</text>
<rect x="760.0" y="596.0" width="820.0" height="280.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="770.0" y="618.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">FAILURE INJECTION (Lab 4.2)</text>
<rect x="40.0" y="78.0" width="1520.0" height="70.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">LEARNING FOCUS</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#232F3E">Model multi-step AI workflows as state machines. Use retries for transient errors, Catch for validation failures, and idempotency keys for safe replays.</text>
<rect x="60.0" y="620.0" width="320.0" height="110.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="70.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">RETRY CONFIG</text>
<text x="70.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">• IntervalSeconds: 2</text>
<text x="70.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">• MaxAttempts: 3</text>
<text x="70.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">• BackoffRate: 2.0</text>
<text x="70.0" y="698.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">• On: Lambda.ServiceException, Throttling</text>
<rect x="400.0" y="620.0" width="320.0" height="100.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="410.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">IDEMPOTENCY</text>
<text x="410.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Key: correlation_id</text>
<text x="410.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Store: DynamoDB</text>
<text x="410.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Replay safe: yes — no duplicate tickets</text>
<rect x="780.0" y="620.0" width="480.0" height="110.0" rx="6" fill="#FADBD8" stroke="#DD3522" />
<text x="790.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">LAB 4.2 — Simulate:</text>
<text x="790.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">1) Bedrock throttling → retry</text>
<text x="790.0" y="670.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">2) Invalid JSON → fallback path</text>
<text x="790.0" y="684.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">3) Downstream timeout → Catch → DLQ</text>
<rect x="60.0" y="860.0" width="700.0" height="90.0" rx="6" fill="#FFF8E6" stroke="#FFB800" />
<text x="70.0" y="882.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">INSTRUCTOR TALKING POINT</text>
<text x="70.0" y="896.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Draw the execution graph in Step Functions console during demo. Show one failed execution and read the Cause field together.</text>
