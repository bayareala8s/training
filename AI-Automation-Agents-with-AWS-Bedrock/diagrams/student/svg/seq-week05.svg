<line x1="116.0" y1="316.0" x2="316.0" y2="316.0" stroke="#232F3E" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="216.0" y="308.0" text-anchor="middle" font-size="9" fill="#232F3E">POST /classify</text>
<line x1="316.0" y1="316.0" x2="516.0" y2="316.0" stroke="#232F3E" stroke-width="1.5" marker-end="url(#arrow)" />
<text x="416.0" y="308.0" text-anchor="middle" font-size="9" fill="#232F3E">② invoke</text>
