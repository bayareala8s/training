<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Week 5 — API Request Flow</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">What happens when a client calls POST /classify</text>
<rect x="40.0" y="78.0" width="1520.0" height="60.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">YOUR GOAL</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Follow an HTTP request from client to response — including throttling and error codes.</text>
<rect x="80.0" y="480.0" width="380.0" height="120.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="90.0" y="502.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">HTTP STATUS CODES</text>
<text x="90.0" y="516.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">200 — valid classified result</text>
<text x="90.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">400 — bad input / validation fail</text>
<text x="90.0" y="544.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">429 — throttled (retry with backoff)</text>
<text x="90.0" y="558.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">500 — unexpected server error</text>
<rect x="500.0" y="480.0" width="300.0" height="90.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="510.0" y="502.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Request body:</text>
<text x="510.0" y="516.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">{</text>
<text x="510.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;text&amp;quot;: &amp;quot;server down in prod&amp;quot;,</text>
<text x="510.0" y="544.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;correlation_id&amp;quot;: &amp;quot;req-001&amp;quot;</text>
<text x="510.0" y="558.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">}</text>
<rect x="840.0" y="480.0" width="300.0" height="90.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="850.0" y="502.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Success response:</text>
<text x="850.0" y="516.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">{</text>
<text x="850.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;label&amp;quot;: &amp;quot;incident&amp;quot;,</text>
<text x="850.0" y="544.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;confidence&amp;quot;: 0.88,</text>
<text x="850.0" y="558.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">  &amp;quot;route&amp;quot;: &amp;quot;team_ops&amp;quot;</text>
<text x="850.0" y="572.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">}</text>
<rect x="80.0" y="660.0" width="400.0" height="72.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="90.0" y="682.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">DO THIS</text>
<text x="90.0" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Test with curl against ApiEndpoint output.</text>
<text x="90.0" y="710.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Try missing correlation_id → expect 400.</text>
<rect x="520.0" y="660.0" width="420.0" height="72.0" rx="6" fill="#F3E8FF" stroke="#8C4FFF" />
<text x="530.0" y="682.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">REMEMBER</text>
<text x="530.0" y="696.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Every request needs correlation_id for tracing in CloudWatch + audit.</text>
<rect x="80.0" y="280.0" width="72.0" height="72.0" rx="4" fill="#232F3E" stroke="#ffffff" stroke-width="2"/>
