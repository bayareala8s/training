<text x="40.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Labs — Deploy Cycle (cycle.sh)</text>
<text x="40.0" y="60.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#565656">One command: test → deploy → verify → teardown</text>
<rect x="40.0" y="78.0" width="1420.0" height="60.0" rx="6" fill="#E8F4FD" stroke="#527FFF" />
<text x="50.0" y="100.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">YOUR GOAL</text>
<text x="50.0" y="114.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Understand the full lab lifecycle before your first AWS deploy.</text>
<rect x="80.0" y="460.0" width="440.0" height="100.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="90.0" y="482.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">ONE COMMAND</text>
<text x="90.0" y="496.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">cd labs</text>
<text x="90.0" y="510.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">PROJECT_PREFIX=ba-la8s-ai-yourname ./scripts/cycle.sh</text>
<text x="90.0" y="524.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF"></text>
<text x="90.0" y="538.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">Keep stack: ./scripts/cycle.sh --keep-stack</text>
<rect x="560.0" y="460.0" width="440.0" height="100.0" rx="0" fill="#232F3E" stroke="#232F3E" />
<text x="570.0" y="482.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">SET BEFORE DEPLOY</text>
<text x="570.0" y="496.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">export AWS_REGION=us-east-1</text>
<text x="570.0" y="510.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">export PROJECT_PREFIX=ba-la8s-ai-yourname</text>
<text x="570.0" y="524.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF">export BEDROCK_MODEL_ID=amazon.nova-lite-v1:0</text>
<rect x="80.0" y="620.0" width="440.0" height="72.0" rx="6" fill="#E9F7EF" stroke="#248814" />
<text x="90.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">DO THIS</text>
<text x="90.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">Always run cycle.sh first — catches errors before you debug in console.</text>
<rect x="560.0" y="620.0" width="440.0" height="72.0" rx="6" fill="#F3E8FF" stroke="#8C4FFF" />
<text x="570.0" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">REMEMBER</text>
<text x="570.0" y="656.0" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" fill="#232F3E">stop.sh / teardown.sh = delete stack = stop most charges.</text>
