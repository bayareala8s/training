AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BayAreaLa8s — AI Automation & Agents with AWS Bedrock (course labs)

Parameters:
  ProjectPrefix:
    Type: String
    Default: ba-la8s-ai
    Description: Resource name prefix (use your name or team id)
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock foundation model ID (enable in console first; Nova Lite recommended)
  ConfidenceThreshold:
    Type: String
    Default: "0.65"

Globals:
  Function:
    Runtime: python3.11
    Timeout: 120
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        CONFIDENCE_THRESHOLD: !Ref ConfidenceThreshold
        AUDIT_TABLE_NAME: !Ref AuditTable
        MEMORY_TABLE_NAME: !Ref MemoryTable
        RESULTS_TABLE_NAME: !Ref ResultsTable
        MAX_INPUT_CHARS: "8000"
        MAX_OUTPUT_TOKENS: "512"
        DEFAULT_TEMPERATURE: "0.2"

Resources:
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectPrefix}-audit"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  MemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectPrefix}-memory"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectPrefix}-results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: correlation_id
          AttributeType: S
      KeySchema:
        - AttributeName: correlation_id
          KeyType: HASH

  Week2InvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-week2-invoke"
      Handler: week02.lambda_invoke.handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  ClassifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-classify"
      Handler: week03.lambda_classify.handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  RouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-route"
      Handler: week03.lambda_route.handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-validate"
      Handler: week04.lambda_validate.handler.handler
      CodeUri: .

  PersistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-persist"
      Handler: week04.lambda_persist.handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-api"
      Handler: week05.lambda_api.handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
      Events:
        ClassifyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CourseHttpApi
            Path: /classify
            Method: POST
        SummarizeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CourseHttpApi
            Path: /summarize
            Method: POST
        RouteApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CourseHttpApi
            Path: /route
            Method: POST

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-agent"
      Handler: week07.lambda_agent.handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MemoryTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:Converse
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"

  CourseHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WorkflowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${ProjectPrefix}-workflow"
      DefinitionUri: statemachine/workflow.asl.json
      DefinitionSubstitutions:
        ClassifyArn: !GetAtt ClassifyFunction.Arn
        ValidateArn: !GetAtt ValidateFunction.Arn
        PersistArn: !GetAtt PersistFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ClassifyFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PersistFunction

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectPrefix}-api-errors"
      AlarmDescription: Lab 6 — API Lambda errors (test by forcing bad requests)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CourseDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectPrefix}-ai-ops"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Invocations",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Errors",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Duration (p95)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", { "stat": "p95" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Classify Invocations",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ClassifyFunction}", { "stat": "Sum" } ]
                ]
              }
            }
          ]
        }

Outputs:
  ApiEndpoint:
    Description: HTTP API base URL (append /classify, /summarize, /route)
    Value: !Sub "https://${CourseHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  StateMachineArn:
    Description: Step Functions workflow ARN (Lab 4)
    Value: !Ref WorkflowStateMachine
  AuditTableName:
    Value: !Ref AuditTable
  MemoryTableName:
    Value: !Ref MemoryTable
  Week2InvokeFunctionName:
    Value: !Ref Week2InvokeFunction
  AgentFunctionName:
    Value: !Ref AgentFunction
  DashboardName:
    Value: !Ref CourseDashboard
  ApiErrorAlarmName:
    Value: !Ref ApiErrorAlarm
